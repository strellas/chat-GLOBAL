<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat en tiempo real">
    <meta name="theme-color" content="#0f111a">
    <title>Chat via BACKEND | General</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS compartido (un nivel arriba) -->
    <link rel="stylesheet" href="../ass/css/style.css">
    <!-- CSS exclusivo del chat -->
    <link rel="stylesheet" href="../ass/css/chat.css">
</head>
<body>

    <!-- ==================== VENTANA DEL CHAT ==================== -->
    <div id="chat-interface" aria-label="Interfaz de chat">

        <!-- Encabezado -->
        <header>
            <div class="user-info">
                <div class="avatar" id="user-avatar" aria-hidden="true">?</div>
                <div class="header-texts">
                    <span id="chat-title">Chat General</span>
                    <div class="status-row">
                        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
                        <span id="connection-status" aria-live="polite">Inicializando...</span>
                    </div>
                </div>
            </div>

            <!-- Botón de salir -->
            <button id="logout-btn" class="btn-logout" aria-label="Cerrar sesión">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Salir</span>
            </button>
        </header>

        <!-- Contenedor de mensajes -->
        <main id="messages-container" aria-label="Historial de mensajes" role="log"></main>

        <!-- Pie de página / Input -->
        <footer>
            <form id="message-form">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Escribe un mensaje..."
                    maxlength="500"
                    autocomplete="off"
                    autocapitalize="sentences"
                    spellcheck="true"
                    aria-label="Escribe tu mensaje"
                >
                <button type="submit" id="send-btn" aria-label="Enviar mensaje">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- El script es un módulo: script.js importa api.js por su cuenta -->
    <script type="module" src="../ass/js/script.js"></script>
</body>
</html>
